<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BottleBot {% block title %}{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <script src="https://unpkg.com/htmx.org@1.9.10/dist/htmx.min.js"></script>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  {% set sale_window = current_sale_window() %}
  {% if sale_window %}
  <div class="alert alert-warning text-center rounded-0 mb-0 sale-banner" role="alert">
    🔥 {{ sale_window }} sale window active — thresholds adjusted
  </div>
  {% endif %}

  <nav class="navbar navbar-expand-md navbar-dark bg-dark border-bottom">
    <div class="container">
      <a class="navbar-brand fw-bold" href="/">🍺 BottleBot</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain"
        aria-controls="navMain" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMain">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="/">Deals</a></li>
          <li class="nav-item"><a class="nav-link" href="/watchlist">Watchlist</a></li>
          <li class="nav-item"><a class="nav-link" href="/criteria">Criteria</a></li>
          <li class="nav-item"><a class="nav-link" href="/health">Health</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    {% block content %}{% endblock %}
  </main>

  <footer class="container py-3 text-center">
    <small class="text-secondary">BottleBot · Self-hosted · Data updates every 6 h</small>
  </footer>

  <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toast-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // HTMX HX-Trigger toast handler
    // Value can be a plain string or {message, kind} where kind is "success"|"warning"|"danger"
    document.body.addEventListener("showToast", function(e) {
      var val = e.detail;
      var msg = (typeof val === "object" && val.message) ? val.message : val;
      var kind = (typeof val === "object" && val.kind) ? val.kind : "success";
      var colorMap = { success: "text-bg-success", warning: "text-bg-warning", danger: "text-bg-danger" };
      var cls = colorMap[kind] || "text-bg-success";
      var el = document.createElement("div");
      el.className = "toast align-items-center " + cls + " border-0";
      el.setAttribute("role", "alert");
      el.setAttribute("aria-live", "assertive");
      el.innerHTML = '<div class="d-flex"><div class="toast-body">' + msg
        + '</div><button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button></div>';
      document.getElementById("toast-container").appendChild(el);
      new bootstrap.Toast(el, { delay: 5000 }).show();
    });
  </script>
  <script>
    // The visible text for any [data-utc] timestamp stays exactly as the
    // server rendered it (a fixed, unambiguous UTC format) — we only attach
    // a hover tooltip showing the viewer's local-time equivalent.
    function localizeDatetimes(root) {
      (root || document).querySelectorAll("[data-utc]").forEach(function (el) {
        var iso = el.getAttribute("data-utc");
        if (!iso) return;
        var d = new Date(iso);
        if (isNaN(d.getTime())) return;
        el.title = d.toLocaleString() + " (local time)";
        el.removeAttribute("data-utc");
      });
    }
    document.addEventListener("DOMContentLoaded", function () { localizeDatetimes(document); });
    document.body.addEventListener("htmx:afterSwap", function (evt) { localizeDatetimes(evt.detail.target); });
  </script>
</body>
</html>
