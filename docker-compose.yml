# docker-compose.yml
services:
  bottlebot:
    build: .
    container_name: bottlebot-scraper
    restart: unless-stopped
    volumes:
      - ./data:/app/data        # SQLite DB persists here
      - ./config:/app/config    # criteria.yaml
    environment:
      - DB_PATH=/app/data/bottlebot.db
      - TZ=Australia/Sydney
      # Set to "true" to record Dan Murphy's member pricing as price_aud
      # (with the non-member price in was_price_aud). Default: non-member.
      - DANMURPHYS_MEMBER=false
      # Notification secrets (Phase 2) — set these in a root .env file
      # (see .env.example). Missing values default to empty (no alerts sent).
      - BOTTLEBOT_DISCORD_WEBHOOK_URL=${BOTTLEBOT_DISCORD_WEBHOOK_URL:-}
      - BOTTLEBOT_NTFY_URL=${BOTTLEBOT_NTFY_URL:-}
      - BOTTLEBOT_BWS_SUBSCRIPTION_KEY=${BOTTLEBOT_BWS_SUBSCRIPTION_KEY:-}
    command: python -m src.scheduler

  bottlebot-web:
    build: .
    container_name: bottlebot-web
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    ports:
      - "8080:8080"
    environment:
      - DB_PATH=/app/data/bottlebot.db
      - TZ=Australia/Sydney
    command: uvicorn src.web.app:app --host 0.0.0.0 --port 8080
    depends_on:
      - bottlebot
